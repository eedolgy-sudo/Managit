<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Managit — Tasks</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/script.js" defer></script>
</head>
<body>
  <main class="app">
    <h1>My Tasks</h1>
    <form id="task-form">
      <input id="task-name" type="text" placeholder="New task..." aria-label="Task name" required maxlength="200">
      <button type="submit">Add</button>
    </form>
    <p id="message" role="status"></p>
    <ul id="task-list"></ul>
  </main>
</body>
</html>
